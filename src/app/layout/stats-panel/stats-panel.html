<section class="stats-panel neon-box">
  <h2 class="stats-panel__title neon-text">{{ 'stats.title' | transloco }}</h2>
  <dl class="stats-panel__list">
    <div class="stats-panel__row">
      <dt>{{ 'stats.level' | transloco }}</dt>
      <dd>{{ stats.level }}</dd>
    </div>
    <div class="stats-panel__row">
      <dt>{{ 'stats.projects' | transloco }}</dt>
      <dd>{{ stats.projects }}</dd>
    </div>
    <div class="stats-panel__row">
      <dt>{{ 'stats.skills' | transloco }}</dt>
      <dd>{{ stats.skills }}</dd>
    </div>
  </dl>
</section>
